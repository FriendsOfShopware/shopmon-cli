name: Bug report
description: Report a reproducible problem in Shopmon CLI.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please include enough detail for maintainers to reproduce it.
  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include commands, environment variables, and any relevant output.
      placeholder: |
        1. Run ...
        2. Set ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Shopmon CLI version
      placeholder: "0.0.6"
    validations:
      required: false
  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: "go version"
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Linux, macOS, Docker image, CI environment"
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add logs, links, or screenshots if they help explain the issue.
    validations:
      required: false
